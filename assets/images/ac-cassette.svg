<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#eef2f3"/>
  <!-- ceiling tile grid -->
  <rect x="0" y="0" width="400" height="300" fill="#dfe7ea"/>
  <line x1="0" y1="0" x2="400" y2="0" stroke="#c7d3d9" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="300" stroke="#c7d3d9" stroke-width="2"/>
  <line x1="200" y1="0" x2="130" y2="300" stroke="#c7d3d9" stroke-width="2"/>
  <line x1="200" y1="0" x2="270" y2="300" stroke="#c7d3d9" stroke-width="2"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#c7d3d9" stroke-width="2"/>
  <!-- cassette unit panel -->
  <rect x="100" y="80" width="200" height="140" rx="10" fill="#ffffff" stroke="#a9bcc7" stroke-width="3"/>
  <!-- center outlet -->
  <rect x="165" y="130" width="70" height="40" rx="6" fill="#c7d3d9"/>
  <!-- diagonal vent lines to corners -->
  <line x1="165" y1="130" x2="115" y2="95" stroke="#8fa5b3" stroke-width="3"/>
  <line x1="235" y1="130" x2="285" y2="95" stroke="#8fa5b3" stroke-width="3"/>
  <line x1="165" y1="170" x2="115" y2="205" stroke="#8fa5b3" stroke-width="3"/>
  <line x1="235" y1="170" x2="285" y2="205" stroke="#8fa5b3" stroke-width="3"/>
  <circle cx="200" cy="150" r="6" fill="#0f6e5c"/>
  <!-- airflow puffs -->
  <path d="M120 220 Q110 240 90 250" fill="none" stroke="#7fb8ac" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 220 Q290 240 310 250" fill="none" stroke="#7fb8ac" stroke-width="4" stroke-linecap="round"/>
</svg>
