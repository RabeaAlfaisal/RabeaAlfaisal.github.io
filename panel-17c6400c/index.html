<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة إدارة المنتجات</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-header">
    <h1>لوحة إدارة المنتجات</h1>
  </header>

  <main>
    <section class="card" id="statusCard" hidden></section>

    <section class="card">
      <h2 id="formTitle">إضافة منتج جديد</h2>
      <form id="productForm">
        <input type="hidden" id="f_id" />
        <div class="form-grid">
          <div>
            <label for="f_model">الموديل</label>
            <input type="text" id="f_model" placeholder="مثال: TCL2963Xs23D" required />
          </div>
          <div>
            <label for="f_brand">الماركة</label>
            <select id="f_brand" required></select>
            <div id="brandLogoPreview" class="logo-preview"></div>
            <button type="button" class="btn-secondary btn-small" id="addBrandToggleBtn">+ إضافة ماركة أخرى</button>
          </div>
          <div>
            <label for="f_price">السعر (ر.س)</label>
            <input type="number" id="f_price" min="0" step="1" required />
          </div>
          <div>
            <label for="f_image">مسار الصورة</label>
            <input type="text" id="f_image" placeholder="assets/images/placeholder.svg" />
            <img id="imagePreview" class="image-preview" alt="معاينة صورة المنتج" hidden />
          </div>
          <div>
            <label for="f_type">النوع</label>
            <select id="f_type">
              <option value="سبليت">سبليت</option>
              <option value="شباك">شباك</option>
              <option value="كاسيت">كاسيت</option>
            </select>
          </div>
          <div>
            <label for="f_capacity_ton">السعة بالطن</label>
            <input type="number" id="f_capacity_ton" min="0" step="0.5" required />
          </div>
          <div>
            <label for="f_capacity_btu">السعة (BTU)</label>
            <input type="number" id="f_capacity_btu" min="0" step="1" required />
          </div>
          <div>
            <label for="f_mode">وضع التشغيل</label>
            <select id="f_mode">
              <option value="بارد فقط">بارد فقط</option>
              <option value="حار فقط">حار فقط</option>
              <option value="حار وبارد">حار وبارد</option>
            </select>
          </div>
          <div>
            <label for="f_compressor_type">نوع الكمبروسر</label>
            <select id="f_compressor_type">
              <option value="انفرتر">انفرتر</option>
              <option value="عادي">عادي</option>
            </select>
          </div>
        </div>

        <label for="f_description">الوصف</label>
        <textarea id="f_description"></textarea>

        <div class="checkbox-field">
          <input type="checkbox" id="f_power_saving" />
          <label for="f_power_saving">موفر للكهرباء</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="f_in_stock" checked />
          <label for="f_in_stock">متوفر في المخزون</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="saveProductBtn">حفظ المنتج</button>
          <button type="button" class="btn-secondary" id="cancelEditBtn" hidden>إلغاء التعديل</button>
        </div>
      </form>

      <div id="newBrandBox" class="card" hidden>
        <label for="newBrandName">اسم الماركة الجديدة</label>
        <input type="text" id="newBrandName" />
        <p style="font-size:0.85rem;color:var(--color-muted);margin-top:-6px">سيُولَّد شعار افتراضي تلقائياً من اسم الماركة.</p>
        <div class="form-actions">
          <button type="button" class="btn-primary btn-small" id="saveBrandBtn">حفظ الماركة</button>
          <button type="button" class="btn-secondary btn-small" id="cancelBrandBtn">إلغاء</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>كل المنتجات (بما فيها المؤرشفة)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الموديل</th>
              <th>الماركة</th>
              <th>السعر</th>
              <th>النوع</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
